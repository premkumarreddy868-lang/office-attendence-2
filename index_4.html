<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Attendance</title>
<style>
  :root {
    --green: #1a7f37;
    --red: #c0392b;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 14px; }
  select, button {
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  select { width: 100%; margin-bottom: 12px; background: #fff; }
  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1;
    cursor: pointer;
    font-weight: 600;
    border: none;
    color: #fff;
    transition: opacity .15s;
  }
  button:hover { opacity: .88; }
  .btn-present { background: var(--green); }
  .btn-absent { background: var(--red); }
  #markResult { margin-top: 12px; font-size: 14px; min-height: 18px; }
  .emp-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fff;
  }
  .emp-row:hover { border-color: #9aa1a9; }
  .emp-name { font-weight: 600; font-size: 15px; }
  .emp-counts { font-size: 12px; color: var(--muted); }
  .emp-counts .p { color: var(--green); font-weight: 600; }
  .emp-counts .a { color: var(--red); font-weight: 600; }
  .summary-row {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .summary-box {
    flex: 1; text-align: center; padding: 10px; border-radius: 8px; background: var(--bg);
  }
  .summary-box .num { font-size: 20px; font-weight: 700; }
  .summary-box .lbl { font-size: 11px; color: var(--muted); }
  .summary-box.present .num { color: var(--green); }
  .summary-box.absent .num { color: var(--red); }
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; padding: 20px; max-width: 380px; width: 100%;
    max-height: 80vh; overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .modal-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .status-pill { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #fff; }
  .status-pill.present { background: var(--green); }
  .status-pill.absent { background: var(--red); }
  .status-pill.none { background: #b0b6bd; }
  .close-btn { margin-top: 14px; width: 100%; background: #eef0f2; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Office Attendance</h1>
  <div class="sub">Pick your name and mark today's attendance.</div>

  <div class="card">
    <h2>Mark Attendance</h2>
    <select id="empSelect"><option value="">Loading...</option></select>
    <div class="btn-row">
      <button class="btn-present" onclick="mark('present')">Present</button>
      <button class="btn-absent" onclick="mark('absent')">Absent</button>
    </div>
    <div id="markResult"></div>
  </div>

  <div class="card">
    <h2>Employee History</h2>
    <div class="sub" style="margin-bottom:14px;">Tap a name to see their attendance record.</div>
    <div id="empList"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalName"></h3>
    <div class="summary-row" id="modalSummary"></div>
    <div id="modalList"></div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const API = "";
let allEmployees = [];

async function loadEmployees() {
  const res = await fetch(API + "/api/employees");
  const emps = await res.json();
  allEmployees = emps;

  const sel = document.getElementById("empSelect");
  sel.innerHTML = '<option value="">-- Select your name --</option>' +
    emps.map(e => `<option value="${e.id}">${e.name}</option>`).join("");

  renderEmployeeList();
}

function renderEmployeeList() {
  const listEl = document.getElementById("empList");
  if (!allEmployees.length) {
    listEl.innerHTML = '<div class="sub">No employees added yet.</div>';
    return;
  }
  listEl.innerHTML = allEmployees.map(e =>
    `<div class="emp-row" onclick="openHistory(${e.id})">
       <span class="emp-name">${e.name}</span>
       <span class="emp-counts" id="counts-${e.id}">loading...</span>
     </div>`
  ).join("");

  allEmployees.forEach(e => loadQuickCounts(e.id));
}

async function loadQuickCounts(id) {
  const res = await fetch(`${API}/api/employee/${id}/history`);
  const data = await res.json();
  const el = document.getElementById(`counts-${id}`);
  if (el) {
    el.innerHTML = `<span class="p">${data.present_count} present</span> &middot; <span class="a">${data.absent_count} absent</span>`;
  }
}

async function mark(status) {
  const empId = document.getElementById("empSelect").value;
  const resultEl = document.getElementById("markResult");
  if (!empId) {
    resultEl.textContent = "Please select your name first.";
    resultEl.style.color = "#c0392b";
    return;
  }
  try {
    const res = await fetch(API + "/api/mark", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employee_id: parseInt(empId), status })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Failed");
    resultEl.textContent = `Marked ${status} for today (${data.date}).`;
    resultEl.style.color = "#1a7f37";
    loadQuickCounts(parseInt(empId));
  } catch (e) {
    resultEl.textContent = "Error: " + e.message;
    resultEl.style.color = "#c0392b";
  }
}

async function openHistory(id) {
  const res = await fetch(`${API}/api/employee/${id}/history`);
  const data = await res.json();

  document.getElementById("modalName").textContent = data.name;
  document.getElementById("modalSummary").innerHTML = `
    <div class="summary-box present"><div class="num">${data.present_count}</div><div class="lbl">PRESENT</div></div>
    <div class="summary-box absent"><div class="num">${data.absent_count}</div><div class="lbl">ABSENT</div></div>
    <div class="summary-box"><div class="num">${data.total_marked}</div><div class="lbl">TOTAL DAYS</div></div>
  `;

  const list = document.getElementById("modalList");
  if (!data.records.length) {
    list.innerHTML = '<div class="sub">No attendance marked yet.</div>';
  } else {
    list.innerHTML = data.records.map(r =>
      `<div class="modal-row"><span>${r.att_date}</span><span class="status-pill ${r.status}">${r.status}</span></div>`
    ).join("");
  }

  document.getElementById("modalBackdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if (e.target.id === "modalBackdrop") closeModal();
});

loadEmployees();
</script>
</body>
</html>
